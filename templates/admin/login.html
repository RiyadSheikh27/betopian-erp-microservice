<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#060a12;
  --card:rgba(18,26,46,0.96);
  --edge:rgba(232,201,126,0.18);
  --gold:#e8c97e;
  --teal:#3de8c4;
  --txt:#eef1f8;
  --dim:rgba(238,241,248,0.55);
  --in:rgba(255,255,255,0.07);
}

html,body{height:100%;overflow:hidden}

body{
  font-family:'Oswald',sans-serif;
  color:var(--txt);
  background:var(--ink);
  display:flex;align-items:center;justify-content:center;
  cursor:none;
}

/* ── CUSTOM CURSOR ── */
#cur{
  position:fixed;width:10px;height:10px;
  border-radius:50%;background:var(--gold);
  pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
  mix-blend-mode:screen;
}
#cur-ring{
  position:fixed;width:36px;height:36px;
  border-radius:50%;border:1.5px solid rgba(232,201,126,.35);
  pointer-events:none;z-index:9998;
  transform:translate(-50%,-50%);
  transition:width .22s,height .22s,border-color .22s;
}

/* ── CANVAS ── */
canvas{position:fixed;inset:0;z-index:0}

/* grain */
.grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:.025;
}

/* ── CARD ── */
.card{
  position:relative;z-index:10;
  width:412px;
  background:var(--card);
  border:1px solid var(--edge);
  border-radius:18px;
  padding:44px 40px 40px;
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  box-shadow:
    0 0 0 1px rgba(232,201,126,.12),
    0 32px 70px rgba(0,0,0,.8),
    0 0 60px rgba(232,201,126,.06),
    inset 0 1px 0 rgba(255,255,255,.1),
    inset 0 0 40px rgba(232,201,126,.03);
  animation:rise .75s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(26px) scale(.965)}
  to{opacity:1;transform:none}
}
.card::before{
  content:'';position:absolute;
  top:-1px;left:18%;right:18%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

/* ── BRAND ── */
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.brand-mark{
  width:33px;height:33px;border-radius:8px;
  background:linear-gradient(135deg,#10172a,#0d1424);
  border:1px solid rgba(232,201,126,.22);
  display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{width:17px;height:17px}
.brand-name{
  font-family:'Oswald',sans-serif;
  font-size:14px;font-weight:600;
  letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);
}
.live{
  margin-left:auto;display:flex;align-items:center;gap:5px;
  font-size:10.5px;color:rgba(61,232,196,.7);letter-spacing:.5px;
}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:#3de8c4;box-shadow:0 0 7px #3de8c4;
  animation:blink 2.6s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 7px #3de8c4}50%{opacity:.25;box-shadow:none}}

/* ── HEADING ── */
.heading{
  font-family:'Oswald',sans-serif;
  font-size:30px;font-weight:600;
  line-height:1.12;letter-spacing:.5px;
  margin-bottom:5px;
}
.heading em{font-style:normal;color:var(--gold)}
.sub{font-size:13px;color:var(--dim);font-weight:300;letter-spacing:.5px;margin-bottom:30px}

/* ── FIELDS ── */
.field{margin-bottom:15px}
.lbl{
  display:flex;align-items:center;gap:5px;
  font-family:'Oswald',sans-serif;
  font-size:11px;font-weight:400;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px;
}
.lbl::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.65}
.wrap{position:relative}
.ico{
  position:absolute;left:12px;top:50%;
  transform:translateY(-50%);
  color:var(--dim);pointer-events:none;transition:color .2s;
}
.wrap:focus-within .ico{color:var(--teal)}

input[type=text],input[type=password]{
  width:100%;
  padding:11px 12px 11px 39px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(232,201,126,0.2);
  border-radius:9px;
  color:var(--txt);
  font-family:'Oswald',sans-serif;
  font-size:14px;font-weight:300;letter-spacing:.5px;
  outline:none;
  transition:border-color .22s,box-shadow .22s,background .22s;
}
input:focus{
  border-color:rgba(61,232,196,.5);
  background:rgba(61,232,196,.05);
  box-shadow:0 0 0 3px rgba(61,232,196,.1);
}
input::placeholder{color:rgba(238,241,248,.25);font-weight:300}

.eyebtn{
  position:absolute;right:10px;top:50%;
  transform:translateY(-50%);
  background:none;border:none;color:var(--dim);
  cursor:none;padding:4px;transition:color .2s;
}
.eyebtn:hover{color:var(--teal)}

/* ── EXTRAS ── */
.extras{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}
.rem{
  display:flex;align-items:center;gap:7px;
  font-family:'Oswald',sans-serif;
  font-size:12px;font-weight:300;letter-spacing:.5px;
  color:var(--dim);
  cursor:none;user-select:none;
}
.rem input{display:none}
.chk{
  width:14px;height:14px;
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:4px;background:var(--in);
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;
}
.rem input:checked+.chk{background:var(--teal);border-color:var(--teal)}
.forgot{
  font-family:'Oswald',sans-serif;
  font-size:12px;font-weight:300;letter-spacing:.5px;
  color:var(--gold);
  text-decoration:none;opacity:.75;transition:opacity .2s;
}
.forgot:hover{opacity:1;text-decoration:underline}

/* ══ SIGN-IN BUTTON — handcrafted, not AI ══ */
.btn-wrap{margin-bottom:0}

.signin{
  width:100%;border:none;background:none;
  cursor:none;padding:0;outline:none;
  display:block;
}

.btn-body{
  position:relative;
  display:flex;align-items:stretch;
  border-radius:10px;
  border:1px solid rgba(232,201,126,.3);
  background:#0b1221;
  overflow:hidden;
  transition:border-color .28s,transform .15s;
}
.signin:hover .btn-body{
  border-color:rgba(232,201,126,.65);
  transform:translateY(-1px);
}
.signin:active .btn-body{transform:translateY(1px)}

/* left accent slab */
.btn-slab{
  width:4px;flex-shrink:0;
  background:linear-gradient(180deg,var(--gold) 0%,rgba(61,232,196,.8) 100%);
  opacity:.75;transition:opacity .28s;
}
.signin:hover .btn-slab{opacity:1}

/* main label area */
.btn-label{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:13px 18px;
  position:relative;
}

/* ink wash on hover */
.btn-wash{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 120%,rgba(232,201,126,.1) 0%,transparent 65%);
  opacity:0;transition:opacity .35s;pointer-events:none;
}
.signin:hover .btn-wash{opacity:1}

.btn-txt{
  font-family:'Oswald',sans-serif;
  font-size:14px;font-weight:500;
  letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);
  position:relative;z-index:1;
}

/* right arrow pocket */
.btn-arrow{
  width:44px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-left:1px solid rgba(232,201,126,.12);
  color:rgba(232,201,126,.6);
  transition:color .25s,border-color .25s,background .25s;
}
.signin:hover .btn-arrow{
  color:var(--gold);
  border-color:rgba(232,201,126,.3);
  background:rgba(232,201,126,.05);
}
.btn-arrow svg{
  transition:transform .25s;
}
.signin:hover .btn-arrow svg{
  transform:translateX(2px);
}

/* ── FOOTER ── */
.div{
  display:flex;align-items:center;gap:10px;
  margin:20px 0 16px;
  font-size:10.5px;letter-spacing:.5px;
  color:rgba(221,228,240,.25);
}
.div::before,.div::after{content:'';flex:1;height:1px;background:var(--edge)}

.foot{
  display:flex;justify-content:center;gap:18px;
  font-family:'Oswald',sans-serif;
  font-size:11px;font-weight:300;letter-spacing:1px;
}
.foot a{
  color:var(--dim);text-decoration:none;
  transition:color .2s;
  letter-spacing:.3px;
}
.foot a:hover{color:var(--teal)}
</style>
</head>
<body>

<div id="cur"></div>
<div id="cur-ring"></div>
<canvas id="c"></canvas>
<div class="grain"></div>

<div class="card">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L4.5 6.75V11.5C4.5 15.87 7.78 19.97 12 21C16.22 19.97 19.5 15.87 19.5 11.5V6.75L12 3Z" stroke="#e8c97e" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M9 12L11 14L15 10" stroke="#e8c97e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="brand-name">Betopian CMS</span>
    <div class="live"><div class="dot"></div>Online</div>
  </div>

  <h1 class="heading">Good to see<br>you <em>again.</em></h1>
  <p class="sub">Sign in and get back to work.</p>

  <form id="f" method="post" action="">
    <!-- {% csrf_token %} -->

    <div class="field">
      <div class="lbl">Username</div>
      <div class="wrap">
        <span class="ico">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <input type="text" name="username" placeholder="username" autocomplete="username" required/>
      </div>
    </div>

    <div class="field">
      <div class="lbl">Password</div>
      <div class="wrap">
        <span class="ico">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input type="password" id="pw" name="password" placeholder="••••••••" autocomplete="current-password" required/>
        <button type="button" class="eyebtn" id="eye">
          <svg id="eyeico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="extras">
      <label class="rem">
        <input type="checkbox" id="rem"/>
        <span class="chk">
          <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#060a12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
        Keep me signed in
      </label>
      <a href="#" class="forgot">Reset password</a>
    </div>

    <div class="btn-wrap">
      <button type="submit" class="signin" id="signinBtn">
        <div class="btn-body">
          <div class="btn-slab"></div>
          <div class="btn-label">
            <div class="btn-wash"></div>
            <span class="btn-txt">Enter Dashboard</span>
          </div>
          <div class="btn-arrow">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </div>
      </button>
    </div>
  </form>

  <div class="div">api access</div>
  <div class="foot">
    <a href="/api/docs/">Swagger UI</a>
    <a href="/api/redoc/">ReDoc</a>
    <a href="/api/schema/">Schema</a>
  </div>
</div>

<script>
/* ── Cursor ── */
const cur=document.getElementById('cur');
const ring=document.getElementById('cur-ring');
let mx=window.innerWidth/2, my=window.innerHeight/2;
let rx=mx, ry=my;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
(function tick(){
  cur.style.left=mx+'px'; cur.style.top=my+'px';
  rx+=(mx-rx)*.12; ry+=(my-ry)*.12;
  ring.style.left=rx+'px'; ring.style.top=ry+'px';
  requestAnimationFrame(tick);
})();

/* ── Canvas ── */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize',resize);

// Cursor position for canvas
let cx=W/2, cy=H/2;
document.addEventListener('mousemove',e=>{cx=e.clientX;cy=e.clientY;});

/* ── Nodes ── */
const NODES=[];
const N=85;
class Node{
  constructor(){ this.spawn(true); }
  spawn(rand){
    this.x=Math.random()*W;
    this.y=rand?Math.random()*H:-10;
    this.vx=(Math.random()-.5)*.3;
    this.vy=(Math.random()-.5)*.3;
    this.r=Math.random()*1.8+.4;
    this.base=Math.random()*.45+.08;
    this.alpha=this.base;
    // color: mostly gold, some teal, rare rose
    const r=Math.random();
    this.h= r<.55?47 : r<.8?170 : 340;
  }
  update(){
    // cursor repulsion
    const dx=this.x-cx, dy=this.y-cy;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<150){
      const f=(150-d)/150;
      this.vx+=dx/d*f*.09;
      this.vy+=dy/d*f*.09;
    }
    this.vx*=.975; this.vy*=.975;
    this.x+=this.vx; this.y+=this.vy;
    if(this.x<-20||this.x>W+20||this.y<-20||this.y>H+20) this.spawn(false);
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${this.h},65%,72%,${this.alpha})`;
    ctx.fill();
  }
}
for(let i=0;i<N;i++) NODES.push(new Node());

/* ── Ripples ── */
const RIPPLES=[];
document.addEventListener('click',e=>{
  if(e.target.closest('.card')) return;
  for(let i=0;i<2;i++)
    RIPPLES.push({x:e.clientX,y:e.clientY,r:i*18,alpha:.9-i*.3,speed:4+i*2});
});

/* ── Field lines (magnetic trails from cursor) ── */
const LINES=[];
let lineTimer=0;
const LINE_COUNT=6;
class Line{
  constructor(angle){
    this.pts=[{x:cx,y:cy}];
    this.angle=angle;
    this.life=0;
    this.maxLife=55+Math.random()*35;
    this.wobble=Math.random()*Math.PI*2;
  }
  update(){
    this.life++;
    if(this.pts.length<24){
      const last=this.pts[this.pts.length-1];
      const w=Math.sin(this.life*.1+this.wobble)*14;
      const nx=last.x+Math.cos(this.angle+w*.035)*4;
      const ny=last.y+Math.sin(this.angle+w*.035)*4;
      this.pts.push({x:nx,y:ny});
    }
    return this.life<this.maxLife;
  }
  draw(){
    if(this.pts.length<2) return;
    const fade=Math.pow(1-this.life/this.maxLife,1.5);
    ctx.beginPath();
    ctx.moveTo(this.pts[0].x,this.pts[0].y);
    for(let i=1;i<this.pts.length;i++) ctx.lineTo(this.pts[i].x,this.pts[i].y);
    ctx.strokeStyle=`rgba(232,201,126,${fade*.22})`;
    ctx.lineWidth=.9;
    ctx.stroke();
  }
}

/* ── Render ── */
function render(){
  // fade trail
  ctx.fillStyle='rgba(6,10,18,0.16)';
  ctx.fillRect(0,0,W,H);

  // cursor aura
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,240);
  g.addColorStop(0,'rgba(232,201,126,0.065)');
  g.addColorStop(.45,'rgba(61,232,196,0.025)');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // field lines
  if(lineTimer++%16===0)
    for(let i=0;i<LINE_COUNT;i++)
      LINES.push(new Line((Math.PI*2/LINE_COUNT)*i+Math.random()*.4));
  for(let i=LINES.length-1;i>=0;i--){
    if(!LINES[i].update()) LINES.splice(i,1);
    else LINES[i].draw();
  }

  // nodes + edges
  NODES.forEach(n=>n.update());
  for(let a=0;a<NODES.length;a++){
    for(let b=a+1;b<NODES.length;b++){
      const dx=NODES[a].x-NODES[b].x, dy=NODES[a].y-NODES[b].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<105){
        const base=(1-d/105)*.16;
        // boost edges near cursor
        const emx=(NODES[a].x+NODES[b].x)/2, emy=(NODES[a].y+NODES[b].y)/2;
        const cd=Math.sqrt((emx-cx)**2+(emy-cy)**2);
        const boost=cd<180?(1-cd/180)*.38:0;
        ctx.beginPath();
        ctx.moveTo(NODES[a].x,NODES[a].y);
        ctx.lineTo(NODES[b].x,NODES[b].y);
        ctx.strokeStyle=`rgba(61,232,196,${base+boost})`;
        ctx.lineWidth=.55;
        ctx.stroke();
      }
    }
  }
  NODES.forEach(n=>n.draw());

  // ripples
  for(let i=RIPPLES.length-1;i>=0;i--){
    const r=RIPPLES[i];
    r.r+=r.speed; r.alpha-=.022;
    if(r.alpha<=0){ RIPPLES.splice(i,1); continue; }
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(232,201,126,${r.alpha})`;
    ctx.lineWidth=1.2; ctx.stroke();
    if(r.r>40){
      ctx.beginPath(); ctx.arc(r.x,r.y,r.r*.6,0,Math.PI*2);
      ctx.strokeStyle=`rgba(61,232,196,${r.alpha*.55})`;
      ctx.lineWidth=.7; ctx.stroke();
    }
  }

  requestAnimationFrame(render);
}
render();

/* ── Card edge shimmer on hover ── */
let shimmerTimer;
document.querySelector('.card').addEventListener('mouseenter',()=>{
  shimmerTimer=setInterval(()=>{
    const rect=document.querySelector('.card').getBoundingClientRect();
    const side=Math.random()*4|0;
    let x,y;
    if(side===0){x=rect.left+Math.random()*rect.width;y=rect.top+Math.random()*8;}
    else if(side===1){x=rect.right-Math.random()*8;y=rect.top+Math.random()*rect.height;}
    else if(side===2){x=rect.left+Math.random()*rect.width;y=rect.bottom-Math.random()*8;}
    else{x=rect.left+Math.random()*8;y=rect.top+Math.random()*rect.height;}
    RIPPLES.push({x,y,r:0,alpha:.35,speed:2.5});
  },700);
});
document.querySelector('.card').addEventListener('mouseleave',()=>clearInterval(shimmerTimer));

/* ── Password toggle ── */
const pw=document.getElementById('pw');
const eye=document.getElementById('eye');
const eico=document.getElementById('eyeico');
const OPEN=`<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>`;
const SHUT=`<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/>`;
eye.addEventListener('click',()=>{
  const show=pw.type==='password';
  pw.type=show?'text':'password';
  eico.innerHTML=show?SHUT:OPEN;
});
</script>
</body>
</html>
</form>
